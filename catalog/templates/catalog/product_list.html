 {% extends 'catalog/base.html' %}
 {% load my_tags %}
  {% block content %}
  <div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for product in object_list %}
            <div class="col">
                <div class="card shadow-sm">
                  <img src="{{ photos.products | media_filter }}">
                    <div class="card-body">
    <p class="card-text">Наименование: {{ product.name  }}</p>
                        <p class="card-text"> Категория: {{ product.category  }}</p>
    <div class="d-flex justify-content-between align-items-center"> <div class="btn-group">
        <a class="btn btn-primary" href="{% url 'catalog:product_detail' pk=product.pk %}" role="button">Посмотреть</a>
        <a class="btn btn-primary" href="{% url 'catalog:catalog_update' pk=product.pk %}" role="button">Редактировать</a>
        <a class="btn btn-primary" href="{% url 'catalog:catalog_delete' pk=product.pk %}" role="button">Удалить</a>
        </div>
        <small class="text-body-secondary">9 mins</small> </div> </div> </div>
            </div>
            {% endfor %}
        </div>
</div>
</div>
{% endblock %}
